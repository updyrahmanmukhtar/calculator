<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f1e9" />
    <title>Form & Function — Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="workspace">
      <header class="topbar">
        <a class="wordmark" href="#" aria-label="Form and Function home">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>FORM <span class="wordmark-light">& FUNCTION</span></span>
        </a>
        <span class="edition"><span class="status-dot"></span> POCKET TOOL No. 01</span>
      </header>

      <section class="calculator" aria-label="Calculator">
        <div class="calculator-heading">
          <div>
            <p class="eyebrow">A LITTLE CLARITY</p>
            <h1>Calculator<span>.</span></h1>
          </div>
          <button class="history-toggle" id="history-toggle" type="button" aria-label="Show calculation history" aria-expanded="false" title="Calculation history">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.2-5.7L3.5 8.5M3.5 4.5v4h4M12 7v5l3.2 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="expression" id="expression">&nbsp;</div>
          <output class="result" id="result">0</output>
        </div>

        <div class="keypad" aria-label="Calculator keys">
          <button class="key key-utility" data-action="clear" type="button">AC</button>
          <button class="key key-utility" data-action="sign" type="button" aria-label="Change sign">+/−</button>
          <button class="key key-utility" data-action="percent" type="button" aria-label="Percent">%</button>
          <button class="key key-operator" data-operator="÷" type="button" aria-label="Divide">÷</button>

          <button class="key" data-digit="7" type="button">7</button>
          <button class="key" data-digit="8" type="button">8</button>
          <button class="key" data-digit="9" type="button">9</button>
          <button class="key key-operator" data-operator="×" type="button" aria-label="Multiply">×</button>

          <button class="key" data-digit="4" type="button">4</button>
          <button class="key" data-digit="5" type="button">5</button>
          <button class="key" data-digit="6" type="button">6</button>
          <button class="key key-operator" data-operator="−" type="button" aria-label="Subtract">−</button>

          <button class="key" data-digit="1" type="button">1</button>
          <button class="key" data-digit="2" type="button">2</button>
          <button class="key" data-digit="3" type="button">3</button>
          <button class="key key-operator" data-operator="+" type="button" aria-label="Add">+</button>

          <button class="key key-zero" data-digit="0" type="button">0</button>
          <button class="key" data-action="decimal" type="button" aria-label="Decimal point">.</button>
          <button class="key key-equals" data-action="equals" type="button" aria-label="Equals">=</button>
        </div>
        <footer class="calculator-footer">
          <span>GOOD THINGS ADD UP.</span>
          <span>⌘ &nbsp; OR &nbsp; KEYBOARD</span>
        </footer>

        <aside class="history-panel" id="history-panel" aria-label="Calculation history" hidden>
          <div class="history-header"><span>RECENT</span><button id="clear-history" type="button">CLEAR</button></div>
          <ol class="history-list" id="history-list"></ol>
          <p class="history-empty" id="history-empty">Your calculations will show up here.</p>
        </aside>
      </section>
      <p class="page-note">Made for the numbers that matter.</p>
    </main>
  </body>
</html>
